<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PrenotaPadel"><title>PrenotaPadel</title><style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');:root{--green:#00E676;--dark:#0a0a0a;--card:#141414;--border:#222;--text:#f0f0f0;--muted:#666;}*{margin:0;padding:0;box-sizing:border-box;}body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:0 20px 40px;}header{width:100%;padding:50px 0 30px;text-align:center;}h1{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:4px;color:var(--green);line-height:1;}h1 span{color:var(--text);}.subtitle{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:2px;text-transform:uppercase;}.mic-container{display:flex;flex-direction:column;align-items:center;gap:20px;margin:30px 0;}.mic-btn{width:130px;height:130px;border-radius:50%;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}.mic-btn.recording{border-color:var(--green);background:#0a1a0f;animation:pulse 1.5s infinite;}.mic-btn svg{width:52px;height:52px;fill:var(--text);}.mic-btn.recording svg{fill:var(--green);}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,0.3)}50%{box-shadow:0 0 0 20px rgba(0,230,118,0)}}.mic-label{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}.transcript-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 20px;font-size:15px;color:var(--text);line-height:1.5;margin-bottom:16px;display:none;}.transcript-box.visible{display:block;}.transcript-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}.debug-box{width:100%;max-width:400px;background:#1a0a0a;border:1px solid #442222;border-radius:12px;padding:12px;font-size:11px;color:#ff8888;line-height:1.4;margin-bottom:16px;display:none;word-break:break-all;}.debug-box.visible{display:block;}.result-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;display:none;flex-direction:column;gap:12px;}.result-card.visible{display:flex;}.result-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--green);border-bottom:1px solid var(--border);padding-bottom:12px;}.result-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;}.result-key{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;}.result-val{font-weight:500;color:var(--text);}.tipo-badge{background:#00E67622;color:var(--green);border:1px solid #00E67644;padding:3px 12px;border-radius:20px;font-size:12px;letter-spacing:1px;text-transform:uppercase;}.actions{display:flex;gap:12px;margin-top:8px;}.btn{flex:1;padding:14px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s;}.btn-confirm{background:var(--green);color:#000;}.btn-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border);}.status{font-size:13px;color:var(--muted);text-align:center;min-height:20px;margin-top:10px;}.status.error{color:#ff5252;}.loading-dots span{display:inline-block;animation:blink 1.4s infinite;font-size:20px;}.loading-dots span:nth-child(2){animation-delay:0.2s;}.loading-dots span:nth-child(3){animation-delay:0.4s;}@keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}.success-overlay{display:none;flex-direction:column;align-items:center;gap:16px;padding:40px 0;text-align:center;}.success-overlay.visible{display:flex;}.success-icon{width:80px;height:80px;border-radius:50%;background:#00E67622;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;}.success-text{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;color:var(--green);}.success-sub{font-size:14px;color:var(--muted);max-width:300px;}.btn-nuovo{background:var(--card);color:var(--text);border:1px solid var(--border);padding:14px 40px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:8px;}.phone-row{width:100%;max-width:400px;display:none;}.phone-row.visible{display:flex;}.phone-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;width:100%;}.phone-input:focus{border-color:var(--green);}.phone-input::placeholder{color:var(--muted);}.phone-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;width:100%;max-width:400px;display:none;}.phone-label.visible{display:block;}</style></head><body><header><h1>PRENOTA<span>PADEL</span></h1><div class="subtitle">Portici Padel Club</div></header><div class="mic-container"><div class="mic-btn" id="micBtn" onclick="toggleRecording()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg></div><div class="mic-label" id="micLabel">Tocca per parlare</div></div><div class="transcript-box" id="transcriptBox"><div class="transcript-label">Hai detto</div><div id="transcriptText"></div></div><div class="debug-box" id="debugBox"></div><div class="status" id="status"></div><div class="result-card" id="resultCard"><div class="result-title" id="resultName"></div><div class="result-row"><span class="result-key">Tipo</span><span class="tipo-badge" id="resultTipo"></span></div><div class="result-row"><span class="result-key">Data</span><span class="result-val" id="resultData"></span></div><div class="result-row"><span class="result-key">Orario</span><span class="result-val" id="resultOrario"></span></div></div><div class="phone-label" id="phoneLabel">Numero di telefono (opzionale)</div><div class="phone-row" id="phoneRow"><input class="phone-input" id="phoneInput" type="tel" placeholder="es. 333 1234567"></div><div class="actions" id="actionsRow" style="display:none;max-width:400px;width:100%;"><button class="btn btn-cancel" onclick="reset()">Annulla</button><button class="btn btn-confirm" onclick="confirmBooking()">Conferma</button></div><div class="success-overlay" id="successOverlay"><div class="success-icon">✓</div><div class="success-text">PRENOTATO!</div><div class="success-sub" id="successSub"></div><button class="btn-nuovo" onclick="reset()">Nuova prenotazione</button></div><script>var recognition=null,isRecording=false,bookingData=null;function initSpeech(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus('Usa Safari su iPhone.','error');return false;}recognition=new SR();recognition.lang='it-IT';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=function(e){stopRecording();showTranscript(e.results[0][0].transcript);callClaude(e.results[0][0].transcript);};recognition.onerror=function(){stopRecording();setStatus('Errore microfono. Riprova.','error');};recognition.onend=function(){if(isRecording)stopRecording();};return true;}function toggleRecording(){if(isRecording){stopRecording();return;}if(!recognition&&!initSpeech())return;startRecording();}function startRecording(){isRecording=true;document.getElementById('micBtn').classList.add('recording');document.getElementById('micLabel').textContent='Tocca per fermare';setStatus('');recognition.start();}function stopRecording(){isRecording=false;document.getElementById('micBtn').classList.remove('recording');document.getElementById('micLabel').textContent='Tocca per parlare';try{recognition.stop();}catch(e){}}function showTranscript(text){document.getElementById('transcriptText').textContent=text;document.getElementById('transcriptBox').classList.add('visible');}function setStatus(msg,type){var el=document.getElementById('status');el.innerHTML=msg;el.className='status '+(type||'');}function setStatusLoading(){document.getElementById('status').innerHTML='<span class="loading-dots"><span>●</span><span>●</span><span>●</span></span>';}function showDebug(msg){var el=document.getElementById('debugBox');el.textContent=msg;el.classList.add('visible');}function callClaude(text){setStatusLoading();var today=new Date().toISOString().split('T')[0];var payload=JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,messages:[{role:'user',content:'Oggi e '+today+'. Estrai i dati e rispondi SOLO con JSON senza markdown. Formato: {"nome":"Mario","cognome":"Rossi","tipo":"Lezione","data":"'+today+'","ora_inizio":"11:00","ora_fine":"12:00","telefono":""}. tipo solo Lezione o Partita. Prenotazione: '+text}]});var xhr=new XMLHttpRequest();xhr.open('POST','/.netlify/functions/claude',true);xhr.setRequestHeader('Content-Type','application/json');xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status===200){try{var data=JSON.parse(xhr.responseText);var rawText=data.content[0].text.trim();var match=rawText.match(/\{[\s\S]*\}/);if(!match)throw new Error('Nessun JSON');bookingData=JSON.parse(match[0]);document.getElementById('debugBox').classList.remove('visible');showResult(bookingData);}catch(e){setStatus('Errore: '+e.message,'error');}}else{setStatus('Errore server: '+xhr.status,'error');}};xhr.onerror=function(){setStatus('Errore di rete','error');};xhr.send(payload);}function showResult(d){setStatus('');document.getElementById('resultName').textContent=d.cognome+' '+d.nome;document.getElementById('resultTipo').textContent=d.tipo;document.getElementById('resultData').textContent=formatDate(d.data);document.getElementById('resultOrario').textContent=d.ora_inizio+' - '+d.ora_fine;if(d.telefono)document.getElementById('phoneInput').value=d.telefono;document.getElementById('resultCard').classList.add('visible');document.getElementById('phoneLabel').classList.add('visible');document.getElementById('phoneRow').classList.add('visible');document.getElementById('actionsRow').style.display='flex';}function formatDate(dateStr){var parts=dateStr.split('-');var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});}function confirmBooking(){var phone=document.getElementById('phoneInput').value.trim();if(phone)bookingData.telefono=phone;var d=bookingData;var parts=d.data.split('-');var si=d.ora_inizio.replace(':','');var ei=d.ora_fine.replace(':','');var start=parts[0]+parts[1]+parts[2]+'T'+si+'00';
var end=parts[0]+parts[1]+parts[2]+'T'+ei+'00';var title=encodeURIComponent(d.cognome+' '+d.nome+' - '+d.tipo);var details=encodeURIComponent(d.telefono||'');window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+title+'&dates='+start+'/'+end+'&details='+details+'&sf=true','_blank');document.getElementById('resultCard').classList.remove('visible');document.getElementById('transcriptBox').classList.remove('visible');document.getElementById('phoneLabel').classList.remove('visible');document.getElementById('phoneRow').classList.remove('visible');document.getElementById('actionsRow').style.display='none';document.getElementById('successSub').textContent=d.cognome+' '+d.nome+' - '+d.tipo+' - '+formatDate(d.data);document.getElementById('successOverlay').classList.add('visible');document.getElementById('micBtn').style.display='none';document.getElementById('micLabel').style.display='none';}function reset(){bookingData=null;['resultCard','transcriptBox','successOverlay','debugBox'].forEach(function(id){document.getElementById(id).classList.remove('visible');});document.getElementById('phoneLabel').classList.remove('visible');document.getElementById('phoneRow').classList.remove('visible');document.getElementById('actionsRow').style.display='none';document.getElementById('phoneInput').value='';document.getElementById('micBtn').style.display='flex';document.getElementById('micLabel').style.display='block';setStatus('');}</script></body></html>
